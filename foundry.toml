[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./proposals" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]
evm_version = "cancun"
optimizer = true
optimizer-runs = 200
solc = "0.8.17"
via_ir = false

[etherscan]
taiko-hoodi = { key = "${ETHERSCAN_API_KEY}", chain = 167013, url = "https://api.etherscan.io/v2/api?chainid=167013" }
taiko-mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 167000, url = "https://api.etherscan.io/v2/api?chainid=167000" }

[invariant]
runs = 256
depth = 64
fail_on_revert = false
